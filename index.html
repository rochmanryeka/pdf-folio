<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1b1e" />
    <meta
      name="description"
      content="Folio — a private PDF editor in your browser. Add text, shapes, signatures, and images without uploading documents to a server."
    />
    <title>Folio — PDF Studio</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("folio-theme") === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      ><div style="padding: 32px; font-family: system-ui">
        Folio PDF Studio requires JavaScript to edit PDFs locally in your
        browser. Enable JavaScript to open the editor. Your documents are never
        uploaded to a server.
      </div></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
